<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <title>Stream Game — Twitch Viewer</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <script src="/extension-config.js"></script>
    <script defer src="/demo-adapter.js"></script>
    <script type="module" src="/overlay.js"></script>
  </head>
  <body class="extension-view">
    <main id="overlay-root" class="overlay-root" aria-live="polite" aria-atomic="true">
      <section class="game-card loading-card" aria-label="Stream game">
        <span class="status-dot" aria-hidden="true"></span>
        <p>Connecting to the game…</p>
      </section>
    </main>
  </body>
</html>
