<svg xmlns="http://www.w3.org/2000/svg" width="928" height="240" viewBox="0 0 928 240" role="img" aria-labelledby="title desc">
  <title id="title">Twillion full logo — light</title>
  <desc id="desc">A violet pixel mascot head with asymmetric eyes, a crooked smile and a mint pixel, beside an outlined twillion wordmark, on a light background. Flat editable vector shapes.</desc>
  <rect width="928" height="240" fill="#FAF9F6"/>
  <g id="mascot" transform="translate(32 24) scale(12)" shape-rendering="crispEdges">
    <path fill="#7042CB" d="M5 2h6v1h1v1h1v1h1v6h-1v2h-2v1H5v1H3v-2H2v-2H1V6h1V4h2V3h1Z"/>
    <rect fill="#2DD4A8" x="13" y="0" width="2" height="2"/>
    <path fill="#242131" d="M3 7h3v1H3zM10 5h2v1h-2z"/>
    <path fill="#FAF9F6" d="M3 8h4v3H3zM10 7h3v2h-3z"/>
    <path fill="#242131" d="M5 8h2v3H5v-1H4V9h1zM11 7h2v2h-1V8h-1zM6 13h3v-1h1v-1H9v1H6z"/>
  </g>
  <g id="wordmark" transform="translate(256 60) scale(13)" fill="#242131" fill-rule="evenodd" aria-label="twillion">
      <path data-letter="t" transform="translate(0 0)" d="M0 0h2v3h3v2H2v4h3v2H2L0 9Z"/>
      <path data-letter="w" transform="translate(6 0)" d="M0 3h2v5h1V5h2v3h1V3h2v6l-2 2H2L0 9Z"/>
      <path data-letter="i" transform="translate(15 0)" d="M0 0h2v2H0zM0 4h2v7H0z"/>
      <path data-letter="l" transform="translate(18 0)" d="M0 0h2v9l1 1v1H1l-1-1Z"/>
      <path data-letter="l" transform="translate(22 0)" d="M0 0h2v9l1 1v1H1l-1-1Z"/>
      <path data-letter="i" transform="translate(26 0)" d="M0 0h2v2H0zM0 4h2v7H0z"/>
      <path data-letter="o" transform="translate(29 0)" d="M2 3h4l2 2v4l-2 2H2L0 9V5Zm0 2v4h4V5Z"/>
      <path data-letter="n" transform="translate(38 0)" d="M0 3h6l2 2v6H6V5H2v6H0Z"/>
  </g>
