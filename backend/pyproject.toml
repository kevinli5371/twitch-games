[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "twitch-games-backend"
version = "0.1.0"
description = "Backend foundation for the Twitch quote-completion game"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0.40,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
]

[project.optional-dependencies]
dev = ["httpx2>=2.16,<3", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/twitch_games"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires an explicitly configured disposable PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
